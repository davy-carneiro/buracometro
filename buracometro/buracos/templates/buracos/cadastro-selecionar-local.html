<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
    <style>
        body {
            padding: 20px;
            padding-bottom: 200px;
        }

        #titulo {
            margin-top: 40px;
            margin-bottom: 30px;
        }

        #btnConfirmar {
            margin-top: 30px;
        }

        #btnVoltarPrincipal {
            background-color: transparent;
            border: none;
            border-radius: 50%;
            padding: 11px 13px;
            font-size: 30px;
            transition: .2s;
        }


        .btn.btn-large {
            padding: 10px 80px;
            font-size: 18px;
        }

        .centered {
            display: block;
            margin: 0 auto;
        }
    </style>
    <form action="{% url 'cadastrarView' %}">
        <button id="btnVoltarPrincipal" class="btn-icon">
            <i class="custom-size fa-solid fa-arrow-left"></i>
        </button>
    </form>
    <h1 id="titulo">Selecionar local no mapa</h1>
    <div id="mapa" style="width: 100%; height: 600px;"></div>
    <form action="{% url 'passarLocalParaCadastroView' %}" method="post">
        {% csrf_token %} 
        <input id="iptCoordenadasMapa" name="coordenadas" type="hidden" value="">
        <button id="btnConfirmar" class="btn btn-large btn-success centered">Confirmar</button>
    </form>
</body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
<script src="https://kit.fontawesome.com/bcdcf795f9.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script>
    var map = L.map('mapa').setView([-2.5184, -44.2054], 16);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(map);

    var marker = null; // Armazena o marcador atual

    // Evento de clique no mapa
    map.on('click', function(e) {
        var lat = e.latlng.lat; // Latitude
        var lng = e.latlng.lng; // Longitude

        if (marker) {
            map.removeLayer(marker);
        }

        marker = L.marker([lat, lng]);
        // marker = L.marker(e.latlng);

        console.log(marker);

        // Adiciona um marcador no local clicado
        // L.marker([lat, lng]).addTo(map)
        marker.addTo(map)
            .bindPopup('Coordenadas: ' + lat.toFixed(4) + ', ' + lng.toFixed(4))
            .openPopup();
        
        iptCoordenadasMapa.value = `${lat}, ${lng}`;
    });

    var coordenadas = [-2.5184, -44.2054];

    var bounds = [
        [-2.4025, -43.8717], // Coordenada sudoeste
        [-2.8044, -44.5679]  // Coordenada nordeste
    ];

    map.setMaxBounds(bounds);

    // // Configuração de zoom para garantir que o zoom não ultrapasse o nível desejado
    map.on('drag', function() {
        map.panInsideBounds(bounds);
    });
</script>
</html>
